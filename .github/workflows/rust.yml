name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Run tests
        run: cargo test --all-targets

  android-apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Diagnose Android build image
        run: |
          docker run --rm notfl3/cargo-apk sh -lc '
            echo "=== Android SDK environment ==="
            env | sort | grep -E "ANDROID|JAVA|SDK" || true
            echo "=== SDK platform directories ==="
            for d in /opt/android-sdk-linux/platforms /opt/android-sdk/platforms /root/.android-sdk/platforms; do
              if [ -d "$d" ]; then
                echo "--- $d"
                ls -la "$d"
              else
                echo "MISSING: $d"
              fi
            done
            echo "=== SDK manager availability ==="
            command -v sdkmanager || true
            find /opt /usr/local /root -type f -name sdkmanager 2>/dev/null | head -20 || true
            echo "=== Android build tools ==="
            for d in /opt/android-sdk-linux/build-tools /opt/android-sdk/build-tools; do
              if [ -d "$d" ]; then ls -la "$d"; fi
            done
            echo "=== Rust and cargo-apk ==="
            rustc --version
            cargo --version
            cargo quad-apk --help || true
          '
      - name: Build Android APK with cargo-quad-apk
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/root/src" \
            -w /root/src \
            notfl3/cargo-apk sh -lc '
              set -eu
              export ANDROID_HOME=/opt/android-sdk-linux
              export ANDROID_SDK_ROOT=/opt/android-sdk-linux
              SDKMANAGER=/opt/android-sdk-linux/tools/bin/sdkmanager
              echo "Installing Android SDK platform and build tools inside the same container..."
              yes | "$SDKMANAGER" --licenses >/dev/null || true
              "$SDKMANAGER" "platforms;android-29" "build-tools;29.0.3" "platform-tools"
              test -f /opt/android-sdk-linux/platforms/android-29/android.jar
              echo "Updating the container Rust toolchain; bundled Rust 1.79 is too old for current dependencies."
              if ! command -v rustup >/dev/null 2>&1; then
                echo "rustup is unavailable in notfl3/cargo-apk; cannot safely update Rust in this image."
                exit 1
              fi
              rustup update stable
              rustup default stable
              rustup target add aarch64-linux-android
              rustc --version
              cargo quad-apk build --release --bin mobile
            '
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-sort-android-apk
          path: target/android-artifacts/release/apk/*.apk
          if-no-files-found: error
          retention-days: 14
